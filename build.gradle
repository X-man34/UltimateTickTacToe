plugins {
  id 'java'
  id 'application'
  id 'org.openjfx.javafxplugin' version '0.0.13'
  id 'org.beryx.jlink' version '2.25.0'
  id 'org.bytedeco.gradle-javacpp-platform' version '1.5.10'
}

// jar {
