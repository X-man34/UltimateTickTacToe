plugins {
  id 'java'
  id 'application'
  id 'org.openjfx.javafxplugin' version '0.0.13'
  id 'org.beryx.jlink' version '2.25.0'
}

group 'com.hottes.caleb'
version '1.0-SNAPSHOT'

repositories {
  mavenCentral()
}

ext {
  junitVersion = '5.10.2'
}

sourceCompatibility = '22'
targetCompatibility = '22'

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

application {
  mainModule = 'com.hottes.caleb.ultimateticktacktoe'
  mainClass = 'com.hottes.caleb.ultimateticktacktoe.Launcher'
}

javafx {
  version = '22.0.1'
  modules = ['javafx.controls', 'javafx.fxml', 'javafx.swing']
}

dependencies {
  implementation('org.controlsfx:controlsfx:11.2.1')

  testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
  testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")

  // https://mvnrepository.com/artifact/org.json/json
  implementation group: 'org.json', name: 'json', version: '20240303'
// https://mvnrepository.com/artifact/org.junit.platform/junit-platform-suite
  implementation group: 'org.junit.platform', name: 'junit-platform-suite', version: '1.11.0'
// https://mvnrepository.com/artifact/org.openjdk.jol/jol-core
  implementation group: 'org.openjdk.jol', name: 'jol-core', version: '0.17'



  // https://mvnrepository.com/artifact/org.nd4j/nd4j-native-platform
  implementation group: 'org.nd4j', name: 'nd4j-native-platform', version: '0.9.1'




  // https://mvnrepository.com/artifact/org.deeplearning4j/deeplearning4j-core
  implementation group: 'org.deeplearning4j', name: 'deeplearning4j-core', version: '0.9.1'

  //could use this for GPU computation, probably should change the versions of the core dependancy if so
//// https://mvnrepository.com/artifact/org.nd4j/nd4j-cuda-8.0-platform
//implementation group: 'org.nd4j', name: 'nd4j-cuda-8.0-platform', version: '0.9.1'



}

test {
useJUnitPlatform()}

jlink {
  imageZip = project.file("${buildDir}/distributions/app-${javafx.platform.classifier}.zip")
  options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
  launcher {
    name = 'app'
  }
}

jlinkZip {
  group = 'distribution'
}